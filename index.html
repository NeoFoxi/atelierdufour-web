<!doctype html>
<html lang="de-CH">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slideshow</title>

  <link rel="stylesheet" href="index.css">
</head>

<body>

  <nav class="nav-modern">
    <ul>
      <li><a href="/" aria-current="page">Home</a></li>
      <li><a href="/tonerde">Tonerde</a></li>
      <li><a href="/schaufenster">Schaufenster</a></li>
      <li class="dropdown">
        <a href="/workshops">Workshops</a>
        <div class="dropdown-content">
          <a href="/workshop/schoggi-giessen">Schoggi giessen</a>
          <a href="/workshop/pappmache">Pappmaché</a>
          <a href="/workshop/siebdruck">Siebdruck</a>
          <a href="/workshop/offenes-atelier">Offenes Atelier</a>
        </div>
      </li>
      <li><a href="/ueber-mich">Über mich</a></li>
      <li><a href="/kontakt">Kontakt</a></li>
    </ul>
  </nav>

  <main class="slider" id="slider">
    <div class="layer" id="layerA"><img id="imgA"></div>
    <div class="layer" id="layerB"><img id="imgB"></div>

    <div class="controls">
      <button class="btn" id="prevBtn">‹</button>
      <button class="btn" id="nextBtn">›</button>
    </div>

    <div class="footer">
      <div class="dots" id="dots"></div>
      <div style="display:flex;gap:10px;">
        <span class="pill" id="counter">1 / 5</span>
        <label class="pill">
          <input type="checkbox" id="autoToggle" checked>
          Auto
        </label>
      </div>
    </div>
  </main>

  <script src="index.js" defer></script>
</body>

</html>
